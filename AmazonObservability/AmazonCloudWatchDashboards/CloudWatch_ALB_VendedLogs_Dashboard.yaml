AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Dashboard for Application Load Balancer access, connection, and health check
  logs delivered to CloudWatch Logs as vended logs. Log widgets select records
  with filterIndex on @data_source_name and @data_source_type over SOURCE
  logGroups(), so they take no log group name and work as-is in a Logs
  centralization destination account. The summary row reads AWS/ApplicationELB
  metrics, which in a destination account also needs cross-account observability.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Dashboard
        Parameters:
          - DashboardName
          - DefaultTimeRange
      - Label:
          default: Contributor Insights (optional)
        Parameters:
          - CreateContributorInsightsRules
          - ALBLogGroupName
          - ResourcePrefix
    ParameterLabels:
      DashboardName:
        default: Dashboard name
      DefaultTimeRange:
        default: Default time range
      CreateContributorInsightsRules:
        default: Create Contributor Insights rules
      ALBLogGroupName:
        default: ALB log group name
      ResourcePrefix:
        default: Resource name prefix

Parameters:
  DashboardName:
    Type: String
    Default: ALB-Insights
    Description: Name of the CloudWatch dashboard to create.
    AllowedPattern: '^[A-Za-z0-9_-]+$'

  DefaultTimeRange:
    Type: String
    Default: '-PT3H'
    AllowedValues: ['-PT1H', '-PT3H', '-PT12H', '-P1D', '-P3D', '-P7D']
    Description: >
      Time range the dashboard opens on. Every widget below the summary row is a
      Log Analytics query, so this directly sets how much log data each refresh
      scans. Three hours suits an operational view; widen it in the console when
      investigating an incident.

  CreateContributorInsightsRules:
    Type: String
    Default: 'Yes'
    AllowedValues: ['Yes', 'No']
    Description: >
      Add two Contributor Insights rules and a dashboard row that continuously
      ranks top client IPs and top targets. Contributor Insights is charged per
      rule per month plus per million matched log events. Choose No and sections 1
      through 6 still function in full; only section 7 is omitted.

  ALBLogGroupName:
    Type: String
    Default: /aws/elb
    Description: >
      Log group receiving ALB logs. The dashboard widgets do not use this value;
      they locate ALB records by data source index across every log group in the
      Region. It is required only by the Contributor Insights rules, which must
      name a concrete log group. Ignored when you choose No above.

  ResourcePrefix:
    Type: String
    Default: ALB
    Description: >
      Prefix for the Contributor Insights rule names. Change it if you deploy this
      stack more than once per Region.
    AllowedPattern: '^[A-Za-z0-9-]+$'

Conditions:
  EnableContributorInsights: !Equals [!Ref CreateContributorInsightsRules, 'Yes']

Resources:
  ALBDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref DashboardName
      DashboardBody: !Sub
        - |
          {
            "start": "${DefaultTimeRange}",
            "periodOverride": "auto",
            "widgets": [
              {
                "type": "metric",
                "x": 0,
                "y": 0,
                "width": 4,
                "height": 4,
                "properties": {
                  "metrics": [
                    [
                      {
                        "expression": "SUM(SEARCH('{AWS/ApplicationELB,LoadBalancer} MetricName=\"RequestCount\"', 'Sum'))",
                        "label": "Requests",
                        "id": "k0"
                      }
                    ]
                  ],
                  "region": "${AWS::Region}",
                  "title": "Requests",
                  "view": "singleValue",
                  "setPeriodToTimeRange": true,
                  "sparkline": false,
                  "period": 300
                }
              },
              {
                "type": "metric",
                "x": 4,
                "y": 0,
                "width": 4,
                "height": 4,
                "properties": {
                  "metrics": [
                    [
                      {
                        "expression": "SUM(SEARCH('{AWS/ApplicationELB,LoadBalancer} MetricName=\"HTTPCode_ELB_5XX_Count\"', 'Sum'))",
                        "label": "ELB 5xx",
                        "id": "k1"
                      }
                    ]
                  ],
                  "region": "${AWS::Region}",
                  "title": "ELB 5xx",
                  "view": "singleValue",
                  "setPeriodToTimeRange": true,
                  "sparkline": false,
                  "period": 300
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 0,
                "width": 4,
                "height": 4,
                "properties": {
                  "metrics": [
                    [
                      {
                        "expression": "SUM(SEARCH('{AWS/ApplicationELB,LoadBalancer} MetricName=\"HTTPCode_Target_4XX_Count\"', 'Sum'))",
                        "label": "Target 4xx",
                        "id": "k2"
                      }
                    ]
                  ],
                  "region": "${AWS::Region}",
                  "title": "Target 4xx",
                  "view": "singleValue",
                  "setPeriodToTimeRange": true,
                  "sparkline": false,
                  "period": 300
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 0,
                "width": 4,
                "height": 4,
                "properties": {
                  "metrics": [
                    [
                      {
                        "expression": "SUM(SEARCH('{AWS/ApplicationELB,LoadBalancer} MetricName=\"TargetConnectionErrorCount\"', 'Sum'))",
                        "label": "Target connection errors",
                        "id": "k3"
                      }
                    ]
                  ],
                  "region": "${AWS::Region}",
                  "title": "Target connection errors",
                  "view": "singleValue",
                  "setPeriodToTimeRange": true,
                  "sparkline": false,
                  "period": 300
                }
              },
              {
                "type": "metric",
                "x": 16,
                "y": 0,
                "width": 4,
                "height": 4,
                "properties": {
                  "metrics": [
                    [
                      {
                        "expression": "MAX(SEARCH('{AWS/ApplicationELB,LoadBalancer} MetricName=\"TargetResponseTime\"', 'p99'))",
                        "label": "Worst target p99 (s)",
                        "id": "k4"
                      }
                    ]
                  ],
                  "region": "${AWS::Region}",
                  "title": "Worst target p99 (s)",
                  "view": "singleValue",
                  "setPeriodToTimeRange": true,
                  "sparkline": false,
                  "period": 300
                }
              },
              {
                "type": "metric",
                "x": 20,
                "y": 0,
                "width": 4,
                "height": 4,
                "properties": {
                  "metrics": [
                    [
                      {
                        "expression": "MAX(SEARCH('{AWS/ApplicationELB,LoadBalancer,TargetGroup} MetricName=\"UnHealthyHostCount\"', 'Maximum'))",
                        "label": "Unhealthy hosts (max)",
                        "id": "k5"
                      }
                    ]
                  ],
                  "region": "${AWS::Region}",
                  "title": "Unhealthy hosts (max)",
                  "view": "singleValue",
                  "setPeriodToTimeRange": true,
                  "sparkline": false,
                  "period": 300
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 4,
                "width": 24,
                "height": 2,
                "properties": {
                  "markdown": "## 1. Request volume and status code distribution\nRequest rate per load balancer and the distribution of status codes returned to clients. Source: **access logs**."
                }
              },
              {
                "type": "log",
                "x": 0,
                "y": 6,
                "width": 12,
                "height": 6,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"access\"]\n| parse elb /^app\\/(?<lb>[^\\/]+)/\n| stats count(*) as requests by bin(5m), lb",
                  "region": "${AWS::Region}",
                  "title": "Requests by load balancer",
                  "view": "timeSeries",
                  "stacked": true
                }
              },
              {
                "type": "log",
                "x": 12,
                "y": 6,
                "width": 12,
                "height": 6,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"access\"]\n| fields concat(substr(elb_status_code,0,1),\"xx\") as class\n| stats count(*) as requests by class\n| sort class asc",
                  "region": "${AWS::Region}",
                  "title": "Status class distribution",
                  "view": "pie"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 12,
                "width": 24,
                "height": 2,
                "properties": {
                  "markdown": "## 2. Error analysis\n5xx, 4xx, and requests with no target response over time, then the specific status code and target combinations behind them. Source: **access logs**."
                }
              },
              {
                "type": "log",
                "x": 0,
                "y": 14,
                "width": 12,
                "height": 6,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"access\"]\n| stats sum(elb_status_code >= 500) as status_5xx, sum(elb_status_code >= 400) - sum(elb_status_code >= 500) as status_4xx, sum(target_status_code = \"-\") as no_target_response by bin(5m)",
                  "region": "${AWS::Region}",
                  "title": "Errors over time",
                  "view": "timeSeries",
                  "stacked": false
                }
              },
              {
                "type": "log",
                "x": 12,
                "y": 14,
                "width": 12,
                "height": 6,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"access\"]\n| filter elb_status_code >= 400\n| parse elb /^app\\/(?<lb>[^\\/]+)/\n| stats count(*) as occurrences, count_distinct(target_port) as targets, latest(time) as last_seen by lb, elb_status_code, target_status_code\n| sort occurrences desc\n| limit 20",
                  "region": "${AWS::Region}",
                  "title": "Status code detail by load balancer and target",
                  "view": "table"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 20,
                "width": 24,
                "height": 2,
                "properties": {
                  "markdown": "## 3. Latency analysis\nPer-route latency percentiles, and the p99 split across the three phases ALB reports per request: `request_processing_time` (client to load balancer), `target_processing_time` (application), `response_processing_time` (load balancer to client). Source: **access logs**."
                }
              },
              {
                "type": "log",
                "x": 0,
                "y": 22,
                "width": 12,
                "height": 8,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"access\"]\n| filter target_processing_time >= 0\n| parse request_line /^(?<method>\\S+)\\s+(?<url>\\S+)/\n| parse url /^[a-z]+:\\/\\/[^\\/]*(?<path>[^?]*)/\n| parse path /^\\/(?<s1>[^\\/]*)\\/?(?<s2>[^\\/]*)/\n| fields if(s2 = \"\", concat(\"/\",s1), concat(\"/\",s1,\"/\",s2)) as route\n| stats count(*) as requests, avg(target_processing_time)*1000 as avg_ms, pct(target_processing_time,90)*1000 as p90_ms, pct(target_processing_time,99)*1000 as p99_ms, max(target_processing_time)*1000 as max_ms by route\n| sort p99_ms desc\n| limit 15",
                  "region": "${AWS::Region}",
                  "title": "Endpoint latency by route - p90 / p99 / max",
                  "view": "table"
                }
              },
              {
                "type": "log",
                "x": 12,
                "y": 22,
                "width": 12,
                "height": 8,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"access\"]\n| filter target_processing_time >= 0\n| stats pct(request_processing_time,99)*1000 as p99_request_ms, pct(target_processing_time,99)*1000 as p99_target_ms, pct(response_processing_time,99)*1000 as p99_response_ms by bin(5m)",
                  "region": "${AWS::Region}",
                  "title": "Request phase latency - p99 by processing stage",
                  "view": "timeSeries",
                  "stacked": false
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 30,
                "width": 24,
                "height": 2,
                "properties": {
                  "markdown": "## 4. Target health and health check diagnostics\nProbe outcomes with the `reason_code` explaining each failure, which `UnHealthyHostCount` does not expose. The lower table joins access and health check logs in a single query, so request errors and probe failures appear side by side per target. Source: **health check and access logs**."
                }
              },
              {
                "type": "log",
                "x": 0,
                "y": 32,
                "width": 12,
                "height": 7,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"health_check\"]\n| stats sum(status = \"PASS\") as passed, sum(status = \"FAIL\") as failed by bin(5m)",
                  "region": "${AWS::Region}",
                  "title": "Health check probe outcomes",
                  "view": "timeSeries",
                  "stacked": false
                }
              },
              {
                "type": "log",
                "x": 12,
                "y": 32,
                "width": 12,
                "height": 7,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"health_check\"]\n| filter status = \"FAIL\"\n| parse elb /^app\\/(?<lb>[^\\/]+)/\n| stats count(*) as failures, pct(latency,99)*1000 as p99_probe_ms, earliest(time) as first_seen, latest(time) as last_seen by lb, target_addr, reason_code, status_code\n| sort failures desc\n| limit 20",
                  "region": "${AWS::Region}",
                  "title": "Health check failures by reason code",
                  "view": "table"
                }
              },
              {
                "type": "log",
                "x": 0,
                "y": 39,
                "width": 24,
                "height": 8,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"access\",\"health_check\"]\n| fields coalesce(target_port, target_addr) as target\n| filter ispresent(target)\n| parse elb /^app\\/(?<lb>[^\\/]+)/\n| stats count(request_line) as requests, sum(elb_status_code >= 500) as errors_5xx, sum(elb_status_code >= 500)*100.0/count(request_line) as error_pct, pct(target_processing_time,99)*1000 as p99_ms, count(status) as probes, sum(status = \"FAIL\") as probe_failures by lb, target\n| sort probe_failures desc, errors_5xx desc\n| limit 20",
                  "region": "${AWS::Region}",
                  "title": "Per-target reliability - request errors and health check outcomes",
                  "view": "table"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 47,
                "width": 24,
                "height": 2,
                "properties": {
                  "markdown": "## 5. Fault attribution - load balancer or target\n`target_status_code` is `-` when the target returned no status, which means the load balancer generated the 5xx. A concrete code there means the application returned the error. Source: **access logs**."
                }
              },
              {
                "type": "log",
                "x": 0,
                "y": 49,
                "width": 24,
                "height": 6,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"access\"]\n| filter elb_status_code >= 500\n| parse elb /^app\\/(?<lb>[^\\/]+)/\n| fields if(target_status_code = \"-\", \"load balancer / network\", \"target application\") as owner\n| stats count(*) as errors, count_distinct(target_port) as targets_affected, earliest(time) as first_seen, latest(time) as last_seen by owner, lb, elb_status_code\n| sort errors desc",
                  "region": "${AWS::Region}",
                  "title": "HTTP 5xx attribution",
                  "view": "table"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 55,
                "width": 24,
                "height": 2,
                "properties": {
                  "markdown": "## 6. Client connections and TLS termination\nOne record per TCP connection carrying the client address, negotiated TLS protocol and cipher, and handshake latency, none of which appear in access logs. A low requests-per-connection ratio alongside 502s indicates connection handling rather than application logic. Source: **connection logs**, plus access logs for the ratio."
                }
              },
              {
                "type": "log",
                "x": 0,
                "y": 57,
                "width": 12,
                "height": 7,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"connection\"]\n| parse elb /^app\\/(?<lb>[^\\/]+)/\n| stats count(*) as connections, count_distinct(listener_port) as listeners, latest(time) as last_seen by client_ip, lb\n| sort connections desc\n| limit 20",
                  "region": "${AWS::Region}",
                  "title": "Top clients by connection count",
                  "view": "table"
                }
              },
              {
                "type": "log",
                "x": 12,
                "y": 57,
                "width": 12,
                "height": 7,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"connection\"]\n| parse elb /^app\\/(?<lb>[^\\/]+)/\n| stats count(*) as connections, count_distinct(client_ip) as distinct_clients, pct(tls_handshake_latency,99)*1000 as p99_handshake_ms by lb, listener_port, tls_protocol, tls_cipher\n| sort connections desc\n| limit 20",
                  "region": "${AWS::Region}",
                  "title": "TLS posture by listener",
                  "view": "table"
                }
              },
              {
                "type": "log",
                "x": 0,
                "y": 64,
                "width": 24,
                "height": 5,
                "properties": {
                  "query": "SOURCE logGroups()\n| filterIndex @data_source_name in [\"aws_alb\"]\n| filterIndex @data_source_type in [\"access\",\"connection\"]\n| parse elb /^app\\/(?<lb>[^\\/]+)/\n| stats count(request_line) as requests, count(listener_port) as tcp_connections, count(request_line)*1.0/count(listener_port) as reqs_per_connection, count_distinct(client_ip) as distinct_clients, sum(elb_status_code = 502) as http_502, sum(target_status_code = \"-\") as no_target_response by lb\n| sort reqs_per_connection asc",
                  "region": "${AWS::Region}",
                  "title": "Connection reuse and 502 errors by load balancer",
                  "view": "table"
                }
              }${ContributorInsightsWidgets}
            ]
          }
        - ContributorInsightsWidgets: !If
            - EnableContributorInsights
            - !Sub |-
                ,
                {
                  "type": "text",
                  "x": 0,
                  "y": 69,
                  "width": 24,
                  "height": 2,
                  "properties": {
                    "markdown": "## 7. Continuous top-N contributors\nThe tables above rank contributors across the dashboard time range on each refresh. Contributor Insights rules rank continuously at one-minute resolution and retain 15 months of history. Created because **CreateContributorInsightsRules** is set to Yes."
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 71,
                  "width": 12,
                  "height": 7,
                  "properties": {
                    "title": "Top client IPs by connection count",
                    "region": "${AWS::Region}",
                    "insightRule": {
                      "maxContributorCount": 10,
                      "orderBy": "Sum",
                      "ruleName": "${ResourcePrefix}-TopClientIPs-ConnectionLogs"
                    },
                    "view": "timeSeries",
                    "period": 300,
                    "legend": {
                      "position": "right"
                    }
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 71,
                  "width": 12,
                  "height": 7,
                  "properties": {
                    "title": "Top targets by request volume",
                    "region": "${AWS::Region}",
                    "insightRule": {
                      "maxContributorCount": 15,
                      "orderBy": "Sum",
                      "ruleName": "${ResourcePrefix}-TopTargetsByRequests-AccessLogs"
                    },
                    "view": "timeSeries",
                    "period": 300,
                    "legend": {
                      "position": "right"
                    }
                  }
                }
            - ''

  # --- Contributor Insights rules (optional) ------------------------------
  # A Contributor Insights rule attaches to a named log group and cannot select by
  # data source index, so each rule selects its log type by field presence instead.
  # client_ip is a discrete field only in the connection log; access logs carry the
  # client as client_port in "ip:port" form.
  TopClientIPsRule:
    Type: AWS::CloudWatch::InsightRule
    Condition: EnableContributorInsights
    Properties:
      RuleName: !Sub '${ResourcePrefix}-TopClientIPs-ConnectionLogs'
      RuleState: ENABLED
      RuleBody: !Sub |
        {
          "Schema": { "Name": "CloudWatchLogRule", "Version": 1 },
          "LogGroupNames": ["${ALBLogGroupName}"],
          "LogFormat": "JSON",
          "AggregateOn": "Count",
          "Contribution": {
            "Keys": ["$.client_ip"],
            "Filters": [
              { "Match": "$.client_ip", "IsPresent": true }
            ]
          }
        }

  # target_port is present in access and connection records, so request_line is
  # required as well to keep this rule on access logs only.
  TopTargetsByRequestsRule:
    Type: AWS::CloudWatch::InsightRule
    Condition: EnableContributorInsights
    Properties:
      RuleName: !Sub '${ResourcePrefix}-TopTargetsByRequests-AccessLogs'
      RuleState: ENABLED
      RuleBody: !Sub |
        {
          "Schema": { "Name": "CloudWatchLogRule", "Version": 1 },
          "LogFormat": "JSON",
          "LogGroupNames": ["${ALBLogGroupName}"],
          "AggregateOn": "Count",
          "Contribution": {
            "Keys": ["$.target_port"],
            "Filters": [
              { "Match": "$.target_port", "IsPresent": true },
              { "Match": "$.request_line", "IsPresent": true }
            ]
          }
        }

Outputs:
  DashboardURL:
    Description: Direct link to the deployed dashboard.
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${DashboardName}'

  ContributorInsightsCreated:
    Description: >
      Whether the two Contributor Insights rules and the ranking row were created.
      The six question sections work either way.
    Value: !Ref CreateContributorInsightsRules

  ContributorInsightsLogGroup:
    Description: >
      Log group the Contributor Insights rules are attached to. The dashboard
      widgets query by data source index and do not use this value.
    Value: !If [EnableContributorInsights, !Ref ALBLogGroupName, 'not applicable']
